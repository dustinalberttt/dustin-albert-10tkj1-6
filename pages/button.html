<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Button</title>
    <style>
        body {
            background-color: #f4f6f9;
            font-family: Arial, sans-serif;
            margin: 30px;
        }
        h2 {
            color: #2c3e50;
            font-size: 20px;
        }
        .btn {
            display: inline-block;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
        }
        .button-group .btn {
            margin-right: 10px;
            margin-bottom: 10px;
        }
        .btn-primary {
            background-color: navy;
            color: #ffffff;
        }

        .btn-secondary {
            background-color: rgba(41, 128, 185, 0.2);
        }
        .btn-outline {
            background-color: #ffffff;
            border: 2px solid #2c3e50;
        }
        .btn-send {
            background-color: rgb(211, 84, 0);
            color: #ffffff;
        }
        .btn-secondary, .btn-outline {
            color: #2c3e50;
        }
        .btn-primary:hover {
            background-color: #000055;
        }
        .btn-secondary:hover {
            background-color: rgba(41, 128, 185, 0.4);
        }
        .btn-outline:hover {
            background-color: #ecf0f1;
        }
        .btn-send:hover {
            background-color: rgb(175, 65, 0);
        }
    </style>
</head>
<body>
    <main>
        <h2>my data</h2>
        <div class="button-group">
            <a href="#" class="btn btn-primary">Lihat Proyek</a>
            <a href="#" class="btn btn-secondary">Unduh CV</a>
            <a href="#" class="btn btn-outline">Hubungi Saya</a>
            <a href="#" class="btn btn-send">Kirim Pesan</a>
        </div>
          <section>
            <h2>Tautan Saya</h2>
            <ul>
                <li><a href="https://wa.me/6285252526677" target="_blank">Profil Whatsapp Saya</a></li>
            </ul>
        </section>
    </main>
    <footer style="margin-top: 40px;">
        <a href="../index.html">Kembali ke Beranda</a>
    </footer>
</body>
</html>
